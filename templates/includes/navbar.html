{# url_name of the current page, e.g. "list" / "create" — used to highlight the active link #}
{% with current=request.resolver_match.url_name %}
<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'books:list' %}">📚 Bookstore</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNavbar" aria-controls="mainNavbar"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if current == 'list' %}active{% endif %}"
             {% if current == 'list' %}aria-current="page"{% endif %}
             href="{% url 'books:list' %}">Catalog</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if current == 'create' %}active{% endif %}"
             {% if current == 'create' %}aria-current="page"{% endif %}
             href="{% url 'books:create' %}">Add book</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
        </li>
      </ul>

      {# Quick search: GET to the catalog with only ?q=... #}
      <form class="d-flex" role="search" method="get" action="{% url 'books:list' %}">
        <input class="form-control me-2" type="search" name="q"
               value="{{ request.GET.q }}" placeholder="Title or author"
               aria-label="Search">
        <button class="btn btn-outline-light" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
{% endwith %}
